# Only trusted main writes caches. PR jobs restore, verify and rebuild protected code.
name: secret-release-trusted-cache
on:
  push:
    branches: [main]
    paths: ['blake3/**', 'g1-release/**', 'wots-lamport/**', 'secret-release/**', 'scripts/**', '.github/workflows/secret-release*.yml']
  workflow_dispatch:
permissions:
  contents: read
cache-mode: write
jobs:
  dependencies:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        project: [blake3, g1-release, wots-lamport]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ${{ matrix.project }}
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - name: Build trusted dependency closure with resource caps
        run: ./$PROJECT/setup.sh
      - name: Bind source pins and compiled bytes
        id: key
        run: |
          python3 scripts/cache_trust.py seal "$PROJECT"
          echo "key=$(python3 scripts/cache_trust.py key "$PROJECT")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ${{ matrix.project }}/.lake/packages
            ${{ matrix.project }}/.lake/trusted-dependency-builds.json
            ${{ matrix.project }}/.lake/trusted-dependency-configs.sha256
            ${{ matrix.project }}/.lake/ci-cache-manifest.json
