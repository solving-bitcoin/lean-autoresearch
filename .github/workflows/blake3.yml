# PR-owned authoring preview. Never use this workflow as submission acceptance.
name: blake3-authoring-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'blake3/**'
      - '.github/workflows/blake3*.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  preview-blake3:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: blake3
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - name: Prepare trusted dependencies with RAM cap
        run: ./blake3/setup.sh
      - name: Preview contract changes without accepting a score
        run: ./blake3/benchmark.sh --authoring-preview
      - name: Measure optional uncertified half-gates baseline
        run: python3 blake3/scripts/baseline.py
      - name: Publish certificate status and byte measurements
        run: python3 blake3/scripts/summary.py "$GITHUB_STEP_SUMMARY"
      - name: Check whitespace
        run: git diff --check
