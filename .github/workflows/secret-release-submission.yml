# Every executable instruction and dependency comes from the immutable base.
name: secret-release-trusted-submission
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'blake3/**'
      - 'g1-release/**'
      - 'secret-release/**'
      - '.github/workflows/secret-release*.yml'
      - 'scripts/**'
      - 'GarblingPrize/Protected/**'
permissions:
  contents: read
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - id: projects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          projects=$(python3 -I trusted/secret-release/scripts/projects.py --base trusted --candidate candidate --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA")
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
  verify:
    needs: projects
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Admit only regular submission blobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -I trusted/secret-release/scripts/overlay.py
          --base trusted --candidate candidate --project "$PROJECT"
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --output admitted
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: trusted/${{ matrix.project }}
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - name: Prepare base-pinned dependencies
        working-directory: trusted
        run: "./$PROJECT/setup.sh"
      - name: Verify with base-owned rules
        working-directory: trusted
        run: "./$PROJECT/benchmark.sh --submission \"$GITHUB_WORKSPACE/admitted\""
      - name: Publish base-owned status
        working-directory: trusted
        run: python3 "$PROJECT/scripts/summary.py" "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.project }}-certified
          path: |
            trusted/${{ matrix.project }}/.yukon/bundle.tar.gz
            trusted/${{ matrix.project }}/.yukon/*score.json
          if-no-files-found: error
