name: blake3-trusted-submission

# This workflow and every executable verifier file come from the base revision.
# Candidate code is never used for workflow, setup, configuration, or auditing.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'blake3/**'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  verify-blake3-submission:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out immutable trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Admit only submission blobs against trusted base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -I trusted/blake3/scripts/check_overlay.py
          --base trusted --candidate candidate
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          --output admitted-submission
      - name: Install base-pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: trusted/blake3
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - name: Prepare only base-pinned dependencies with RAM cap
        working-directory: trusted
        run: ./blake3/setup.sh
      - name: Verify admitted submission with base-owned rules
        working-directory: trusted
        run: ./blake3/benchmark.sh --submission "$GITHUB_WORKSPACE/admitted-submission"
      - name: Publish base-owned certification result
        working-directory: trusted
        run: python3 blake3/scripts/summary.py "$GITHUB_STEP_SUMMARY"
