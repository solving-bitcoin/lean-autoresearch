# PR-owned preview only. Trusted acceptance uses secret-release-submission.yml.
name: secret-release-authoring-preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'blake3/**'
      - 'g1-release/**'
      - 'secret-release/**'
      - '.github/workflows/secret-release*.yml'
      - 'scripts/**'
      - 'GarblingPrize/Protected/**'
permissions:
  contents: read
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: projects
        run: echo "projects=$(python3 secret-release/scripts/projects.py)" >> "$GITHUB_OUTPUT"
  preview:
    needs: projects
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ${{ matrix.project }}
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - name: Prepare protected dependencies with resource caps
        run: "./$PROJECT/setup.sh"
      - name: Verify and test four generated tools
        run: "./$PROJECT/benchmark.sh --authoring-preview"
      - name: Publish status
        run: python3 "$PROJECT/scripts/summary.py" "$GITHUB_STEP_SUMMARY"
      - name: Export tool bundle and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.project }}-authoring-preview
          path: |
            ${{ matrix.project }}/.yukon/bundle.tar.gz
            ${{ matrix.project }}/.yukon/*score.json
          if-no-files-found: error
      - run: git diff --check
