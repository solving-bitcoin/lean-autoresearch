name: challenge-verifier

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
      - name: Install pinned dependencies
        run: ./setup.sh
      - name: Standalone source and root checks
        run: ./scripts/check.sh
      - name: Isolated ranked theorem
        run: ./benchmark.sh
      - name: Hostile verifier fixtures
        run: python3 scripts/run_hostile_fixtures.py
      - name: Clean diff
        run: git diff --check
